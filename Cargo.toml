[package]
name = "system_reporter"
version = "0.4.0"
edition = "2021"

[[bin]]
name = "system_reporter"
path = "src/main.rs"

[[bin]]
name = "encrypt_tokens"
path = "tools/encrypt_tokens.rs"

[dependencies]
# Системная информация
sysinfo = "0.30"
whoami = "1.5"
local-ip-address = "0.6"

# Низкоуровневый доступ к Windows
wmi = "0.15"

# Информация о дисплеях
display-info = "0.4"

# Сериализация (JSON)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Telegram Bot (Асинхронность)
tokio = { version = "1", features = ["full"] }
teloxide = { version = "0.12", features = ["macros"] }
reqwest = { version = "0.11", features = ["multipart"] }

# Обработка ошибок
anyhow = "1.0"
thiserror = "1.0"

# Работа с датой и временем
chrono = "0.4"

# Криптография (шифрование токенов)
aes-gcm = "0.10"
base64 = "0.21"
rand = "0.8"
argon2 = "0.5"
